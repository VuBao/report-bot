name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: 103.77.214.210
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /root/report-bot
            git pull origin main
            update_env() {
              key="$1"
              value="$2"
              if [ -z "$value" ]; then
                return
              fi
              touch .env
              ENV_KEY="$key" ENV_VALUE="$value" python3 -c 'import os; from pathlib import Path; path = Path(".env"); key = os.environ["ENV_KEY"]; value = os.environ["ENV_VALUE"]; lines = path.read_text().splitlines() if path.exists() else []; prefix = key + "="; index = next((i for i, line in enumerate(lines) if line.startswith(prefix)), None); lines.append(prefix + value) if index is None else lines.__setitem__(index, prefix + value); path.write_text("\n".join(lines) + "\n")'
            }
            update_env AI_PROVIDER "auto"
            update_env OPENAI_MODEL "${{ secrets.OPENAI_MODEL }}"
            update_env OPENAI_API_KEY "${{ secrets.OPENAI_API_KEY }}"
            update_env TELEGRAM_BOT_TOKEN "${{ secrets.TELEGRAM_BOT_TOKEN }}"
            if [ -x venv/bin/pip ]; then
              venv/bin/pip install -r requirements.txt
            else
              python3 -m pip install -r requirements.txt
            fi
            systemctl restart report-bot
